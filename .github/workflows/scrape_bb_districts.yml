name: Scrape BB Districts

on:
  workflow_dispatch:   # run manually whenever you want

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml openpyxl

      - name: Run scraper
        run: python scrapers/mshsaa_bb_scraper.py

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: boys-basketball-districts
          path: boys_basketball_districts.xlsx
          retention-days: 30
